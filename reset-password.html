<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Campus Explorer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Reset password</h1>
      <p class="subtitle">Set a new password after opening the email reset link.</p>
      <form id="reset-form">
        <label>
          New password
          <input type="password" name="password" required minlength="8" autocomplete="new-password">
        </label>
        <label>
          Confirm password
          <input type="password" name="password_confirm" required minlength="8" autocomplete="new-password">
        </label>
        <button type="submit">Update password</button>
      </form>
      <div id="message" class="message" role="alert"></div>
      <p style="margin-top:16px"><a href="index.html">Back to sign in</a></p>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8"></script>
  <script>
    const messageEl = document.getElementById('message');
    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message show ${type}`;
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!window.isSupabaseConfigured()) {
        showMessage('Supabase not configured.', 'warning');
        return;
      }
      const form = new FormData(e.target);
      if (String(form.get('password')) !== String(form.get('password_confirm'))) {
        showMessage('Passwords do not match.', 'error');
        return;
      }
      const { createClient } = supabase;
      const client = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
        auth: { detectSessionInUrl: true, persistSession: true },
      });
      const { error } = await client.auth.updateUser({ password: String(form.get('password')) });
      if (error) showMessage(error.message, 'error');
      else showMessage('Password updated. You can sign in.', 'success');
    });
  </script>
</body>
</html>
