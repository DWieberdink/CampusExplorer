# Deploy static site to GitHub Pages from main.
# After first enable: Repo Settings → Pages → Source = GitHub Actions.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site bundle
        run: |
          mkdir _site
          # Static app + seed; omit git/metadata, ETL package, and SQL sources.
          for path in index.html explorer.html admin.html auth-confirm.html reset-password.html \
            favicon.svg css js data README.md; do
            cp -a "$path" _site/
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
